<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRP | ตรวจสอบผู้สมัคร</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f9ff;color:#20314b;font-family:system-ui,'Segoe UI',sans-serif}header{background:linear-gradient(115deg,#fff,#e7f2ff);border-bottom:1px solid #dce7f6;padding:20px max(18px,calc((100vw - 1180px)/2))}nav,.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}nav{justify-content:space-between}.brand{font-size:21px;font-weight:850;color:#3158ad;text-decoration:none}.brand b{color:#f58b35}main{max-width:1180px;margin:28px auto;padding:0 18px}.panel{background:#fff;border:1px solid #dce7f6;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px #3158ad0b}h1{font-size:25px;margin:0 0 10px}h2{font-size:19px;margin:0 0 14px}p{line-height:1.65}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid #cbd7e8;border-radius:10px;background:#fff;color:#20314b}textarea{min-height:90px}button,.btn{border:0;border-radius:10px;padding:11px 16px;background:#3158ad;color:white;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e9f0ff;color:#3158ad}.danger{background:#bd4252}.toolbar>*{flex:1 1 170px}.toolbar button{flex:0 0 auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:5px;font-size:14px;font-weight:600}.wide{grid-column:1/-1}.tablewrap{overflow:auto;width:100%}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8eef7;vertical-align:top}th{background:#f2f6ff}.muted{color:#667791;font-size:13px}.status{margin:12px 0;color:#3158ad;min-height:20px}.hidden{display:none!important}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips button{background:#edf2fa;color:#3158ad}.chips button.active{background:#3158ad;color:#fff}.checkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,180px);gap:12px;align-items:center;padding:12px;border-bottom:1px solid #e8eef7}.mandatory{background:#fff4e7;border-left:4px solid #f58b35;padding-left:9px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:15px;border:1px solid #dce7f6;border-radius:12px}.metric strong{display:block;font-size:25px;color:#3158ad}dialog{border:0;border-radius:16px;width:min(760px,calc(100% - 20px));max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#1c2c4c99}@media(max-width:680px){main{margin:14px auto;padding:0 10px}.panel{padding:15px}.grid,.cards{grid-template-columns:1fr}.checkrow{grid-template-columns:1fr}h1{font-size:21px}nav{align-items:flex-start}.toolbar button{flex:1 1 100%}dialog{padding:15px}table{min-width:550px}}</style></head><body><header><nav><a class="brand" href="index.html">CRP <b>|</b> ตรวจสอบผู้สมัคร</a><a class="btn secondary" href="admin.html">เจ้าหน้าที่</a></nav></header><main><section class="panel"><h1>ตรวจสอบสถานะผู้สมัคร</h1><p class="muted">ค้นหาจากรหัสผู้สมัครหรือชื่อ-นามสกุล</p><div class="toolbar"><input id="query" placeholder="รหัสหรือชื่อผู้สมัคร" aria-label="ค้นหาผู้สมัคร"><button id="search">ค้นหา</button><button class="secondary" id="selected">ผู้ผ่านการคัดเลือกเข้ารับการฝึก</button></div><div class="status" id="message"></div><div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>สถานะ</th><th>ผลตรวจร่างกาย</th><th>กลุ่มฝึก</th></tr></thead><tbody id="results"></tbody></table></div></section></main><script>const GAS_URL='https://script.google.com/macros/s/AKfycbwVQTb4kDCrGbg9OY7a9sio7IRl08-2Ag8EmOkkw_jBv3V6S3-WytWJXH2N5IR_pHGl/exec';let ready=false,channel='',frame=null,pending=new Map(),seq=0;const direct=typeof google!=='undefined'&&google.script&&google.script.run;
function call(action,payload={}){if(direct)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e)))).apiRequest(action,payload));return new Promise(async(resolve,reject)=>{try{await connect();let id='req'+(++seq),timer=setTimeout(()=>{pending.delete(id);reject(new Error('หมดเวลารอการตอบกลับจาก Apps Script'))},45000);pending.set(id,{resolve,reject,timer});frame.contentWindow.postMessage({crp:'request',channel,id,action,payload},'*')}catch(e){reject(e)}})}
function connect(){if(ready)return Promise.resolve();if(window._connecting)return window._connecting;window._connecting=new Promise((resolve,reject)=>{if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(GAS_URL)){reject(new Error('กรุณาตั้งค่า GAS_URL ใน HTML เป็นลิงก์ /exec ของ Web App'));return}channel=Array.from(crypto.getRandomValues(new Uint8Array(20)),x=>x.toString(16).padStart(2,'0')).join('');frame=document.createElement('iframe');frame.hidden=true;frame.title='CRP connection';frame.src=GAS_URL+'?page=bridge&channel='+encodeURIComponent(channel);document.body.appendChild(frame);let timer=setTimeout(()=>reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ: ตรวจสอบ Deploy, /exec และ CRP_GITHUB_ORIGIN')),25000);window.addEventListener('message',function handler(e){if(!/^https:\/\/[^/]*googleusercontent\.com$/.test(e.origin)&&!/^https:\/\/script\.google\.com$/.test(e.origin))return;let m=e.data;if(!m||m.channel!==channel)return;if(m.crp==='ready'){ready=true;clearTimeout(timer);resolve()}else if(m.crp==='response'){let job=pending.get(m.id);if(!job)return;clearTimeout(job.timer);pending.delete(m.id);m.ok?job.resolve(m.data):job.reject(new Error(m.message||'เกิดข้อผิดพลาด'))}}) });return window._connecting}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notice(t){$('#message').textContent=t||''}function fail(e){notice('ข้อผิดพลาด: '+(e.message||e))}
async function search(selected=false){notice('กำลังโหลดข้อมูล...');$('#results').innerHTML='';try{const r=await call(selected?'publicTrainingSelected':'publicSearch',{query:$('#query').value,limit:200});$('#results').innerHTML=(r.items||[]).map(x=>`<tr><td>${esc(x.applicationId)}</td><td>${esc(x.fullName)}</td><td>${esc(x.status)}</td><td>${esc(x.medicalScore||'-')}</td><td>${esc(x.trainingGroup||'-')}</td></tr>`).join('')||'<tr><td colspan="5">ไม่พบข้อมูล</td></tr>';notice('พบ '+r.total+' รายการ')}catch(e){fail(e)}}$('#search').onclick=()=>search();$('#selected').onclick=()=>search(true);$('#query').onkeydown=e=>{if(e.key==='Enter')search()};search();</script></body></html>
