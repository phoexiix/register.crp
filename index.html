<!DOCTYPE html>
<html lang="th">
 <head>
  <base target="_top"/>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   CRP | ตรวจสอบผู้สมัคร
  </title>
  <style>

* {
  box-sizing: border-box
}
body {
  margin: 0;
  font-family: system-ui,'Segoe UI',sans-serif;
  color: #20314b;
  background: #f6f9ff
}
header {
  background: linear-gradient(115deg,#fff,#e7f2ff);
  border-bottom: 1px solid #dce7f6;
  padding: 22px max(20px,calc((100vw - 1180px)/2))
}
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px
}
.brand {
  font-weight: 850;
  font-size: 20px;
  color: #3158ad;
  text-decoration: none
}
.brand b {
  color: #f58b35
}
.navlink {
  color: #6554b7;
  text-decoration: none;
  font-weight: 700
}
main {
  max-width: 1180px;
  margin: 32px auto;
  padding: 0 20px
}
.hero {
  padding: 38px;
  border-radius: 24px;
  background: linear-gradient(115deg,#dceeff,#fff 70%);
  border: 1px solid #d8e7fa
}
.hero h1 {
  font-size: clamp(25px,4vw,42px);
  margin: 0 0 10px
}
.muted {
  color: #71809a
}
.card {
  background: white;
  border: 1px solid #e0e8f3;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 9px 25px #304f8a0b;
  margin-top: 20px
}
input,select,textarea {
  width: 100%;
  border: 1px solid #cbd8ec;
  border-radius: 11px;
  padding: 12px 13px;
  background: #fff;
  color: #23304a;
  font: inherit
}
label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px
}
button,.btn {
  background: #6555cb;
  color: white;
  border: 0;
  border-radius: 11px;
  padding: 12px 19px;
  font-weight: 750;
  cursor: pointer;
  font: inherit;
  text-decoration: none;
  display: inline-block
}
button:hover {
  filter: brightness(.96)
}
.orange {
  background: #f18b39
}
.ghost {
  background: #e9efff;
  color: #4257a2
}
.danger {
  background: #fbe8e8;
  color: #a43333
}
.search {
  display: flex;
  gap: 10px
}
.search input {
  flex: 1
}
.list {
  display: grid;
  gap: 10px
}
.item {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  text-align: left;
  background: #fff;
  color: #20314b;
  border: 1px solid #e0e8f3;
  padding: 17px;
  border-radius: 13px
}
.item:hover {
  border-color: #8e8adf
}
.pill {
  font-size: 12px;
  background: #e8e9ff;
  color: #6254b8;
  border-radius: 20px;
  padding: 6px 10px;
  white-space: nowrap
}
.grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 16px
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
  gap: 14px
}
.stat {
  border-radius: 15px;
  background: #f0f5ff;
  padding: 20px
}
.stat strong {
  display: block;
  font-size: 30px;
  color: #544db0
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 9px
}
.tabs button {
  background: #e8efff;
  color: #4d5e8d
}
.tabs button.active {
  background: #6555cb;
  color: white
}
.hidden {
  display: none!important
}
.overlay {
  position: fixed;
  inset: 0;
  background: #17243ec9;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px
}
.modal {
  background: white;
  border-radius: 20px;
  width: min(100%,880px);
  max-height: 95vh;
  overflow: auto;
  padding: 25px
}
.modal.full {
  width: 100%;
  height: 100%;
  max-height: 100%;
  border-radius: 12px
}
.modaltop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px
}
dl {
  display: grid;
  grid-template-columns: 190px 1fr;
  gap: 13px
}
dt {
  color: #71809a
}
dd {
  margin: 0;
  overflow-wrap: anywhere
}
.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 18px
}
.message {
  min-height: 24px;
  color: #b44646;
  margin: 12px 0
}
table {
  border-collapse: collapse;
  width: 100%
}
td,th {
  padding: 12px;
  border-bottom: 1px solid #e5ebf6;
  text-align: left
}
footer {
  text-align: center;
  color: #7e8aa0;
  padding: 35px
}
@media(max-width:680px) {
  .grid {
    grid-template-columns: 1fr
  }
  .search {
    flex-direction: column
  }
  .hero {
    padding: 23px
  }
  dl {
    grid-template-columns: 1fr
  }
  dt {
    margin-top: 8px
  }
  .item {
    align-items: flex-start;
    flex-direction: column
  }
}
</style>
 </head>
 <body>
  <header>
   <nav>
    <a class="brand" href="&lt;?= appUrl ?&gt;">
     CRP
     <b>
      RECRUITMENT
     </b>
    </a>
    <a class="navlink" href="&lt;?= appUrl ?&gt;?page=admin">
     สำหรับเจ้าหน้าที่ ↗
    </a>
   </nav>
  </header>
  <main>
   <section class="hero">
    <span class="pill">
     Civilian Recruitment &amp; Preparation
    </span>
    <h1>
     โครงการคัดเลือกและเตรียมกำลังพล
     <br/>
     สำหรับบุคคลทั่วไป
    </h1>
    <p class="muted">
     ตรวจสอบข้อมูลการลงทะเบียนและผลการพิจารณาของผู้สมัคร
    </p>
   </section>
   <section class="card">
    <h2>
     ค้นหาข้อมูลผู้สมัคร
    </h2>
    <p class="muted">
     ค้นหาจากชื่อ นามสกุล หรือรหัสผู้สมัคร
    </p>
    <form class="search" id="searchForm">
     <input autocomplete="off" id="query" placeholder="ชื่อ-นามสกุล หรือ CRP-..."/>
     <button>
      ค้นหา
     </button>
    </form>
    <p class="message" id="msg">
    </p>
    <div class="list" id="results">
    </div>
   </section>
  </main>
  <div class="overlay hidden" id="overlay">
   <div class="modal full">
    <div class="modaltop">
     <h2>
      รายละเอียดผู้สมัคร
     </h2>
     <button class="ghost" id="close">
      ปิด ✕
     </button>
    </div>
    <div id="details">
    </div>
   </div>
  </div>
  <footer>
   CRP — Recruitment &amp; Preparation
  </footer>
  <script>
   function callServer(action, payload = {}) {
    return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(new Error(e && e.message || 'เชื่อมต่อ Apps Script ไม่สำเร็จ'))).apiRequest(action, payload);
    });
}
const CRP_API = { call: callServer };
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dateText(v) { if (!v)
    return '-'; const d = new Date(v); return Number.isNaN(d.getTime()) ? esc(v) : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }); }
  </script>
  <script>
   const $ = id => document.getElementById(id);
let items = [];
async function search() { $('msg').textContent = 'กำลังค้นหาข้อมูล...'; $('results').innerHTML = ''; try {
    const r = await CRP_API.call('publicSearch', { query: $('query').value.trim() });
    items = r.items || [];
    $('msg').textContent = `พบข้อมูล ${r.total || 0} รายการ`;
    for (const x of items) {
        const b = document.createElement('button');
        b.className = 'item';
        b.innerHTML = `<span><strong>${esc(x.fullName)}</strong><br><small class="muted">${esc(x.applicationId)}</small></span><span class="pill">${esc(x.status)}</span>`;
        b.onclick = () => show(x.applicationId);
        $('results').append(b);
    }
}
catch (e) {
    $('msg').textContent = e.message;
} }
async function show(id) { $('overlay').classList.remove('hidden'); $('details').textContent = 'กำลังโหลด...'; try {
    const x = await CRP_API.call('publicDetails', { applicationId: id });
    $('details').innerHTML = `<dl><dt>รหัสผู้สมัคร</dt><dd>${esc(x.applicationId)}</dd><dt>ชื่อ-นามสกุล</dt><dd>${esc(x.fullName)}</dd><dt>จังหวัด</dt><dd>${esc(x.province || '-')}</dd><dt>ระดับการศึกษา</dt><dd>${esc(x.education || '-')}</dd><dt>วันที่ลงทะเบียน</dt><dd>${dateText(x.registeredAt)}</dd><dt>การลงทะเบียน</dt><dd>${esc(x.registration)}</dd><dt>ผลการพิจารณา</dt><dd><span class="pill">${esc(x.status)}</span></dd></dl>`;
}
catch (e) {
    $('details').textContent = e.message;
} }
$('searchForm').onsubmit = e => { e.preventDefault(); search(); };
$('close').onclick = () => $('overlay').classList.add('hidden');
$('overlay').onclick = e => { if (e.target === $('overlay'))
    $('close').click(); };
search();
  </script>
 </body>
</html>
