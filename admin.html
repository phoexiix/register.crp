<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เจ้าหน้าที่ | CRP</title><style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');
:root{--blue:#2463e9;--orange:#fa8b37;--purple:#8256df;--dark:#192441;--line:#e4eafb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f2f7ff,#fff 48%,#fff9f5);color:var(--dark);font-family:Sarabun,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:var(--blue);text-decoration:none}.top{background:#fff;box-shadow:0 2px 20px #2563eb0b;border-bottom:1px solid var(--line);padding:18px max(22px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:15px}.symbol{background:linear-gradient(135deg,#2463e9,#8652e4);width:57px;height:57px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:30px;box-shadow:0 10px 24px #2463e93b}.brand strong{display:block;font:700 24px 'Chakra Petch';color:var(--blue)}.brand small{color:var(--muted);font-size:12px}.container{width:min(1200px,calc(100% - 36px));margin:34px auto}.hero{background:linear-gradient(105deg,#e5efff,#faf7ff 70%,#fff0de);padding:36px;border:1px solid #dce7ff;border-radius:30px;margin-bottom:25px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:45px;top:0;font-size:155px;color:#b9cbff88;pointer-events:none}.eyebrow{color:var(--purple);font:700 12px 'Chakra Petch';letter-spacing:3px}.hero h1{font:700 clamp(25px,3.6vw,41px) 'Chakra Petch';margin:10px 0 5px}.hero p{color:#65718a;margin-bottom:0}.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:24px;box-shadow:0 8px 34px #243c7a09}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}.side{grid-column:span 3}.main{grid-column:span 9}.menu{display:grid;gap:10px}.menu button{width:100%;text-align:left;padding:15px 16px;border-radius:15px;border:1px solid transparent;background:#f6f8fd;color:#4c5a77;font-weight:700}.menu button.active{background:#eaf1ff;border-color:#bcd0ff;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.btn{border:0;border-radius:13px;background:linear-gradient(120deg,var(--blue),#5c72ef);color:#fff;font-weight:700;padding:12px 20px}.btn.secondary{background:#eff3fd;color:#385173}.btn.orange{background:linear-gradient(100deg,#fb8b32,#f5a453)}.btn.purple{background:var(--purple)}.btn.outline{background:white;border:1px solid #cbd8f5;color:var(--blue)}.search{width:100%;padding:16px;border:1px solid #d8e3f9;background:#f9fbff;border-radius:15px;outline:0}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb17;outline:none}.toolbar{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:17px}.toolbar h2{margin:0;font:700 23px 'Chakra Petch'}.muted{color:var(--muted)}.records{display:grid;gap:12px}.record{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid #e0e8fb;background:#fff;border-radius:17px;padding:18px;width:100%;transition:.2s}.record:hover{transform:translateY(-2px);border-color:#adc7ff;box-shadow:0 10px 18px #2463e915}.record strong{display:block;font-size:17px}.record small{color:var(--muted);font-size:12px}.tag{display:inline-block;border-radius:99px;padding:7px 12px;background:#fff2e6;color:#bb6a17;font-weight:700;font-size:12px;white-space:nowrap}.tag.pass{background:#e9f8f2;color:#218a60}.tag.fail{background:#feeeee;color:#c74848}.tag.review{background:#efeaff;color:#744acc}.overlay{position:fixed;inset:0;background:#142040b8;z-index:30;display:none;padding:14px}.overlay.show{display:flex;align-items:stretch;justify-content:center}.modal{background:#fff;border-radius:25px;width:min(980px,100%);height:100%;overflow:auto;box-shadow:0 30px 80px #0003}.modalHead{padding:22px 28px;background:linear-gradient(100deg,#e7f0ff,#fbf2ff);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}.modalBody{padding:28px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.detail{background:#f7f9fe;padding:17px;border-radius:14px;min-width:0;overflow-wrap:anywhere}.detail small{display:block;color:#71809a;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:700;color:#475774}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e3f7;border-radius:12px;padding:12px;background:#f9fbff;color:#263658}.field textarea{min-height:100px;resize:vertical}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.stat{padding:24px;border:1px solid #e6eafa;background:linear-gradient(160deg,#fff,#f6f9ff);border-radius:17px}.stat b{display:block;font:700 33px 'Chakra Petch';color:var(--blue)}.stat span{color:#71809b}.foot{text-align:center;color:#8792aa;font-size:12px;padding:25px}.alert{border-radius:12px;padding:12px;background:#fff2e9;color:#9a5525;margin:14px 0}.hidden{display:none!important}@media(max-width:850px){.grid{display:block}.side{margin-bottom:18px}.menu{grid-template-columns:repeat(3,1fr)}.menu button{text-align:center;padding:12px 5px;font-size:12px}.hero{padding:25px}.hero:after{display:none}}@media(max-width:560px){.top{padding:12px 18px}.brand strong{font-size:17px}.brand small{font-size:10px}.symbol{width:45px;height:45px;font-size:24px}.container{margin:18px auto}.card{padding:16px}.details,.formgrid,.stats{grid-template-columns:1fr}.record{flex-wrap:wrap}.modalHead,.modalBody{padding:18px}.top .btn{font-size:11px;padding:10px}.hero h1{font-size:25px}}
</style></head><body><header class="top"><div class="brand"><div class="symbol" aria-label="CRP Logo">✦</div><div><strong>CRP ADMINISTRATION</strong><small>Recruitment Management Center</small></div></div><a class="btn outline" href="index.html">← หน้าสาธารณะ</a></header>
<main class="container"><section class="hero"><div class="eyebrow">AUTHORIZED PERSONNEL ONLY</div><h1>ศูนย์จัดการข้อมูลผู้สมัคร</h1><p>เพิ่มข้อมูลผู้สมัคร · ตรวจสอบและพิจารณาผล · สรุปผลการดำเนินงาน</p></section>
<section class="card" id="loginBox" style="max-width:520px;margin:auto"><h2>เข้าสู่ระบบเจ้าหน้าที่</h2><form id="loginForm" class="formgrid"><div class="field full"><label>ชื่อผู้ใช้</label><input id="username" required autocomplete="username"></div><div class="field full"><label>รหัสผ่าน</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" id="loginBtn" type="submit">เข้าสู่ระบบ</button></form><p class="muted" id="loginInfo">เข้าสู่ระบบเพื่อจัดการใบสมัคร</p></section>
<div class="grid hidden" id="workspace"><aside class="side"><div class="card menu"><button class="active" data-tab="add">＋ เพิ่มข้อมูลผู้สมัคร</button><button data-tab="review">✓ การอนุมัติ</button><button data-tab="summary">▥ สรุปผล</button><button id="logoutBtn" style="color:#c04747">ออกจากระบบ</button></div></aside><section class="main"><div class="card" id="content"></div></section></div></main><div class="foot">CRP • Authorized Operations</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><div class="modalHead"><div><div class="eyebrow">APPLICATION DETAIL</div><h2 id="modalTitle" style="margin:5px 0">ข้อมูลผู้สมัคร</h2></div><button class="btn secondary" onclick="closeModal()">✕ ปิด</button></div><div class="modalBody" id="modalBody"></div></div></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycby45ndrii8sc_eQoyDtt8KrglLbwVZtK8ousvDfwMbdV0KhPkIJgk_K0MJknzMD9fEL/exec';
const CRP_API=(()=>{
 let channel=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/-/g,''),ready=false,frame=null,pending=new Map(),queue=[];
 function init(){
  frame=document.createElement('iframe');frame.title='CRP Connector';frame.style.display='none';
  frame.src=GAS_URL+'?bridge=1&origin='+encodeURIComponent(location.origin)+'&channel='+encodeURIComponent(channel);
  document.body.appendChild(frame);
 }
 window.addEventListener('message',e=>{
  if(!frame||e.source!==frame.contentWindow)return;
  if(!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(e.origin))return;
  const d=e.data;if(!d||d.crpBridge!==true||d.channel!==channel)return;
  if(d.ready){ready=true;queue.splice(0).forEach(fn=>fn());return;}
  const item=pending.get(d.id);if(!item)return;pending.delete(d.id);clearTimeout(item.timer);
  d.result&&d.result.ok?item.resolve(d.result.data):item.reject(new Error(d.result?.error||'เกิดข้อผิดพลาด'));
 });
 function call(action,data={}){return new Promise((resolve,reject)=>{
  let id='r'+Math.random().toString(36).slice(2)+Date.now(),timer=setTimeout(()=>{pending.delete(id);reject(new Error('หมดเวลารอการเชื่อมต่อ ตรวจสอบ Deploy และ ALLOWED_ORIGIN'));},30000);
  pending.set(id,{resolve,reject,timer});
  const send=()=>frame.contentWindow.postMessage({crpBridge:true,channel,id,payload:{action,...data}},'*');
  if(ready)send();else queue.push(send);
 });}
 document.addEventListener('DOMContentLoaded',init);
 return {call};
})();
const $=id=>document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nameOf(r){return [r.Prefix,r.FirstName,r.LastName].filter(Boolean).join(' ');}
function tag(s){return '<span class="tag '+(s==='ผ่านการคัดเลือก'?'pass':s==='ไม่ผ่านการคัดเลือก'?'fail':s==='อยู่ระหว่างพิจารณา'?'review':'')+'">'+esc(s||'รอตรวจสอบ')+'</span>';}
function formatDate(s){if(!s)return '-';let d=new Date(s);return isNaN(d.getTime())?esc(s):d.toLocaleDateString('th-TH',{dateStyle:'medium'});}
function detail(label,value){return '<div class="detail"><small>'+esc(label)+'</small><strong>'+esc(value||'-')+'</strong></div>';}
function showModal(){$('overlay').classList.add('show');document.body.style.overflow='hidden';}
function closeModal(){$('overlay').classList.remove('show');document.body.style.overflow='';}
function message(e){alert(e?.message||String(e));}

let token=sessionStorage.getItem('crp_token')||'',rows=[],currentTab='add';
const fields=[['prefix','คำนำหน้า','select'],['firstName','ชื่อ','text'],['lastName','นามสกุล','text'],['birthDate','วันเกิด','date'],['phone','โทรศัพท์','tel'],['email','อีเมล','email'],['province','จังหวัด','text'],['education','การศึกษา','text'],['motivation','เหตุผลในการสมัคร','textarea']];
function authenticate(yes){$('loginBox').classList.toggle('hidden',yes);$('workspace').classList.toggle('hidden',!yes);if(yes)openTab(currentTab);}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let btn=$('loginBtn');btn.disabled=true;try{let r=await CRP_API.call('login',{username:$('username').value,password:$('password').value});token=r.token;sessionStorage.setItem('crp_token',token);$('password').value='';authenticate(true);}catch(err){$('loginInfo').textContent=err.message;}finally{btn.disabled=false;}});
$('logoutBtn').addEventListener('click',async()=>{try{await CRP_API.call('logout',{token});}catch(e){}token='';sessionStorage.removeItem('crp_token');authenticate(false);});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
function openTab(tab){currentTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='add')drawAdd();if(tab==='review')drawReview();if(tab==='summary')drawSummary();}
function inputHTML([key,label,type]){let required=['firstName','lastName','phone','email'].includes(key)?'required':'';let control=type==='textarea'?'<textarea name="'+key+'"></textarea>':type==='select'?'<select name="'+key+'"><option value="">เลือกคำนำหน้า</option><option>นาย</option><option>นาง</option><option>นางสาว</option><option>อื่น ๆ</option></select>':'<input type="'+type+'" name="'+key+'" '+required+'>';return '<div class="field '+(type==='textarea'?'full':'')+'"><label>'+label+(required?' *':'')+'</label>'+control+'</div>';}
function drawAdd(){$('content').innerHTML='<div class="toolbar"><h2>เพิ่มข้อมูลผู้สมัคร</h2><span class="tag">สำหรับเจ้าหน้าที่</span></div><p class="muted">เมื่อบันทึกสำเร็จ ระบบจะสร้างรหัสผู้สมัครและแสดงในหน้าสาธารณะทันทีหลังรีเฟรช</p><form id="addForm"><div class="formgrid">'+fields.map(inputHTML).join('')+'</div><button class="btn" id="saveBtn" style="margin-top:22px">บันทึกข้อมูลผู้สมัคร</button><p id="saveInfo" class="muted"></p></form>';$('addForm').addEventListener('submit',saveApplicant);}
async function saveApplicant(e){e.preventDefault();let btn=$('saveBtn');btn.disabled=true;try{let data=Object.fromEntries(new FormData(e.target).entries());let result=await CRP_API.call('submit',{token,data});$('saveInfo').textContent='บันทึกสำเร็จ รหัสผู้สมัคร: '+result.applicationId;e.target.reset();}catch(err){message(err);}finally{btn.disabled=false;}}
async function drawReview(){$('content').innerHTML='<div class="toolbar"><h2>การอนุมัติผู้สมัคร</h2><button id="refresh" class="btn secondary">↻ โหลดใหม่</button></div><input class="search" id="find" placeholder="ค้นหาชื่อ นามสกุล รหัส หรือสถานะ"><p class="muted" id="reviewCount">กำลังโหลด...</p><div class="records" id="results"></div>';$('refresh').onclick=fetchRows;$('find').oninput=renderRows;await fetchRows();}
async function fetchRows(){try{rows=await CRP_API.call('list',{token});renderRows();}catch(e){$('reviewCount').textContent=e.message;}}
function renderRows(){let q=($('find')?.value||'').toLocaleLowerCase('th'),a=rows.filter(r=>[r.ApplicationID,r.FirstName,r.LastName,r.Phone,r.Status].join(' ').toLocaleLowerCase('th').includes(q));$('reviewCount').textContent=a.length+' รายการ';$('results').innerHTML=a.length?a.map(r=>'<button class="record" data-id="'+esc(r.ApplicationID)+'"><span><strong>'+esc(nameOf(r))+'</strong><small>'+esc(r.ApplicationID)+' · '+esc(r.Province||'-')+'</small></span>'+tag(r.Status)+'</button>').join(''):'<p class="muted">ไม่พบข้อมูล</p>';}
$('content').addEventListener('click',e=>{let btn=e.target.closest('[data-id]');if(!btn)return;let r=rows.find(v=>v.ApplicationID===btn.dataset.id);if(r)openApplicant(r);});
function openApplicant(r){$('modalTitle').textContent=nameOf(r);let info=[['รหัสผู้สมัคร',r.ApplicationID],['ชื่อ-นามสกุล',nameOf(r)],['วันเกิด',r.BirthDate],['โทรศัพท์',r.Phone],['อีเมล',r.Email],['จังหวัด',r.Province],['การศึกษา',r.Education],['เหตุผลในการสมัคร',r.Motivation],['วันที่สมัคร',formatDate(r.SubmittedAt)]];$('modalBody').innerHTML='<div class="toolbar">'+tag(r.Status)+'</div><div class="details">'+info.map(x=>detail(...x)).join('')+'</div><h3 style="margin-top:28px">พิจารณาผลการสมัคร</h3><form id="decision" class="formgrid"><div class="field full"><label>สถานะ</label><select name="status">'+['รอตรวจสอบ','อยู่ระหว่างพิจารณา','ผ่านการคัดเลือก','ไม่ผ่านการคัดเลือก'].map(s=>'<option '+(r.Status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field full"><label>หมายเหตุเจ้าหน้าที่ (ไม่แสดงในหน้าสาธารณะ)</label><textarea name="note">'+esc(r.AdminNote)+'</textarea></div><button class="btn orange" id="decisionBtn">บันทึกผลการพิจารณา</button></form>';$('decision').addEventListener('submit',async e=>{e.preventDefault();let b=$('decisionBtn');b.disabled=true;try{let d=Object.fromEntries(new FormData(e.target).entries());await CRP_API.call('update',{token,id:r.ApplicationID,status:d.status,note:d.note});closeModal();await fetchRows();}catch(err){message(err);}finally{b.disabled=false;}});showModal();}
async function drawSummary(){$('content').innerHTML='<div class="toolbar"><h2>สรุปผลการรับสมัคร</h2><button class="btn secondary" id="sumRefresh">↻ โหลดใหม่</button></div><div id="statContent">กำลังโหลด...</div>';$('sumRefresh').onclick=drawSummary;try{let d=await CRP_API.call('stats',{token});let pairs=[['ผู้สมัครทั้งหมด',d.total],...Object.entries(d.byStatus)];$('statContent').innerHTML='<div class="stats">'+pairs.map(([key,val])=>'<div class="stat"><b>'+Number(val).toLocaleString('th-TH')+'</b><span>'+esc(key)+'</span></div>').join('')+'</div>'}catch(e){$('statContent').textContent=e.message;}}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
if(token)authenticate(true);
</script></body></html>
