<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRP | Staff Center</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f9ff;color:#20314b;font-family:system-ui,'Segoe UI',sans-serif}header{background:linear-gradient(115deg,#fff,#e7f2ff);border-bottom:1px solid #dce7f6;padding:20px max(18px,calc((100vw - 1180px)/2))}nav,.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}nav{justify-content:space-between}.brand{font-size:21px;font-weight:850;color:#3158ad;text-decoration:none}.brand b{color:#f58b35}main{max-width:1180px;margin:28px auto;padding:0 18px}.panel{background:#fff;border:1px solid #dce7f6;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 4px 20px #3158ad0b}h1{font-size:25px;margin:0 0 10px}h2{font-size:19px;margin:0 0 14px}p{line-height:1.65}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid #cbd7e8;border-radius:10px;background:#fff;color:#20314b}textarea{min-height:90px}button,.btn{border:0;border-radius:10px;padding:11px 16px;background:#3158ad;color:white;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e9f0ff;color:#3158ad}.danger{background:#bd4252}.toolbar>*{flex:1 1 170px}.toolbar button{flex:0 0 auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:5px;font-size:14px;font-weight:600}.wide{grid-column:1/-1}.tablewrap{overflow:auto;width:100%}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8eef7;vertical-align:top}th{background:#f2f6ff}.muted{color:#667791;font-size:13px}.status{margin:12px 0;color:#3158ad;min-height:20px}.hidden{display:none!important}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chips button{background:#edf2fa;color:#3158ad}.chips button.active{background:#3158ad;color:#fff}.checkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,180px);gap:12px;align-items:center;padding:12px;border-bottom:1px solid #e8eef7}.mandatory{background:#fff4e7;border-left:4px solid #f58b35;padding-left:9px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:15px;border:1px solid #dce7f6;border-radius:12px}.metric strong{display:block;font-size:25px;color:#3158ad}dialog{border:0;border-radius:16px;width:min(760px,calc(100% - 20px));max-height:90vh;overflow:auto;padding:22px}dialog::backdrop{background:#1c2c4c99}@media(max-width:680px){main{margin:14px auto;padding:0 10px}.panel{padding:15px}.grid,.cards{grid-template-columns:1fr}.checkrow{grid-template-columns:1fr}h1{font-size:21px}nav{align-items:flex-start}.toolbar button{flex:1 1 100%}dialog{padding:15px}table{min-width:550px}}</style></head><body><header><nav><a class="brand" href="index.html">CRP <b>|</b> Staff Center</a><div class="actions"><a class="btn secondary" href="index.html">หน้าสาธารณะ</a><button id="logout" class="secondary hidden">ออกจากระบบ</button></div></nav></header><main><div id="message" class="status"></div><section id="loginbox" class="panel"><h1>เข้าสู่ระบบเจ้าหน้าที่</h1><form id="loginform" class="toolbar"><input id="username" required autocomplete="username" placeholder="ชื่อผู้ใช้"><input id="password" required type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><button>เข้าสู่ระบบ</button></form></section><div id="workspace" class="hidden"><section class="panel"><h1>จัดการผู้สมัคร</h1><div class="cards" id="summary"></div><div class="chips" id="tabs"></div><div class="toolbar"><input id="query" placeholder="ค้นหารหัสหรือชื่อ"><button id="reload">ค้นหา / รีเฟรช</button><button id="add">+ เพิ่มผู้สมัคร</button></div><div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>สถานะ</th><th>กลุ่มฝึก</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted" id="count"></p></section></div></main><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="secondary" id="close">ปิด</button></div></dialog><script>const GAS_URL='https://script.google.com/macros/s/AKfycbwVQTb4kDCrGbg9OY7a9sio7IRl08-2Ag8EmOkkw_jBv3V6S3-WytWJXH2N5IR_pHGl/exec';let ready=false,channel='',frame=null,pending=new Map(),seq=0;const direct=typeof google!=='undefined'&&google.script&&google.script.run;
function call(action,payload={}){if(direct)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e)))).apiRequest(action,payload));return new Promise(async(resolve,reject)=>{try{await connect();let id='req'+(++seq),timer=setTimeout(()=>{pending.delete(id);reject(new Error('หมดเวลารอการตอบกลับจาก Apps Script'))},45000);pending.set(id,{resolve,reject,timer});frame.contentWindow.postMessage({crp:'request',channel,id,action,payload},'*')}catch(e){reject(e)}})}
function connect(){if(ready)return Promise.resolve();if(window._connecting)return window._connecting;window._connecting=new Promise((resolve,reject)=>{if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(GAS_URL)){reject(new Error('กรุณาตั้งค่า GAS_URL ใน HTML เป็นลิงก์ /exec ของ Web App'));return}channel=Array.from(crypto.getRandomValues(new Uint8Array(20)),x=>x.toString(16).padStart(2,'0')).join('');frame=document.createElement('iframe');frame.hidden=true;frame.title='CRP connection';frame.src=GAS_URL+'?page=bridge&channel='+encodeURIComponent(channel);document.body.appendChild(frame);let timer=setTimeout(()=>reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ: ตรวจสอบ Deploy, /exec และ CRP_GITHUB_ORIGIN')),25000);window.addEventListener('message',function handler(e){if(!/^https:\/\/[^/]*googleusercontent\.com$/.test(e.origin)&&!/^https:\/\/script\.google\.com$/.test(e.origin))return;let m=e.data;if(!m||m.channel!==channel)return;if(m.crp==='ready'){ready=true;clearTimeout(timer);resolve()}else if(m.crp==='response'){let job=pending.get(m.id);if(!job)return;clearTimeout(job.timer);pending.delete(m.id);m.ok?job.resolve(m.data):job.reject(new Error(m.message||'เกิดข้อผิดพลาด'))}}) });return window._connecting}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notice(t){$('#message').textContent=t||''}function fail(e){notice('ข้อผิดพลาด: '+(e.message||e))}
let token=sessionStorage.getItem('crp_token')||'',config=null,stage='',records=[];const stages=[['','ทั้งหมด'],['review','รอตรวจสอบ'],['reviewFailed','ไม่ผ่านตรวจสอบ'],['approval','พิจารณา/เลือกกลุ่ม'],['medical','ตรวจร่างกาย'],['training','ผ่านเข้ารับการฝึก'],['rejected','ไม่ได้รับคัดเลือก']];const mandatoryStart=15;const groups=['1/1','1/2','2/1','2/2','3/1','3/2','4/1','4/2'];function show(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal()}$('#close').onclick=()=>$('#modal').close();function formFields(r={}){let fields=[['applicationId','รหัสผู้สมัคร'],['prefix','คำนำหน้า'],['firstName','ชื่อ'],['lastName','นามสกุล'],['birthDate','วันเกิด ค.ศ. YYYY-MM-DD'],['phone','เบอร์โทร 10 หลัก'],['email','อีเมล'],['province','จังหวัด'],['region','ภูมิภาค'],['education','การศึกษา'],['nationality','สัญชาติ'],['ethnicity','เชื้อชาติ'],['motivation','เหตุผลการสมัคร']];return '<form id="appForm"><div class="grid">'+fields.map(([k,label])=>`<label class="field ${k==='motivation'?'wide':''}">${label}<input name="${k}" value="${esc(r[({applicationId:'ApplicationID',prefix:'Prefix',firstName:'FirstName',lastName:'LastName',birthDate:'BirthDate',phone:'Phone',email:'Email',province:'Province',region:'Region',education:'Education',nationality:'Nationality',ethnicity:'Ethnicity',motivation:'Motivation'})[k]]||'')}"></label>`).join('')+'</div><p><button>บันทึกข้อมูล</button></p></form>'}function checkForm(names,data={},mandatory=false){return names.map((name,i)=>`<label class="checkrow ${mandatory&&i>=mandatoryStart?'mandatory':''}"><span>${i+1}. ${esc(name)} ${mandatory&&i>=mandatoryStart?'(บังคับ)':''}</span><select data-check="${i}" required><option value="">เลือกผล</option><option value="ผ่าน" ${data[name]==='ผ่าน'?'selected':''}>ผ่าน</option><option value="ไม่ผ่าน" ${data[name]==='ไม่ผ่าน'?'selected':''}>ไม่ผ่าน</option>${!mandatory&&name==='หนังสืออนุมัติ'?'<option value="ไม่ระบุ">ไม่ระบุ</option>':''}</select></label>`).join('')}function parse(s){try{return JSON.parse(s||'{}')}catch(e){return {}}}function readChecks(names){let out={};document.querySelectorAll('[data-check]').forEach(el=>out[names[Number(el.dataset.check)]]=el.value);return out}async function perform(action,payload){notice('กำลังบันทึก...');try{let r=await call(action,{token,...payload});$('#modal').close();notice('บันทึกสำเร็จ');await load();return r}catch(e){fail(e);alert(e.message||e);throw e}}async function edit(id){let r=id?await call('getApplication',{token,applicationId:id}):{};show(id?'แก้ไขข้อมูลผู้สมัคร':'เพิ่มผู้สมัคร',formFields(r));$('#appForm').onsubmit=async e=>{e.preventDefault();let application=Object.fromEntries(new FormData(e.target).entries());await perform(id?'updateApplication':'addApplication',id?{applicationId:id,application}:{application})}}async function review(id){let r=await call('getApplication',{token,applicationId:id});show('ตรวจสอบคุณสมบัติ: '+id,`<form id="reviewForm">${checkForm(config.checks,parse(r.ReviewData))}<p><button>บันทึกผลตรวจสอบ</button></p></form>`);$('#reviewForm').onsubmit=async e=>{e.preventDefault();await perform('saveReview',{applicationId:id,checks:readChecks(config.checks)})}}async function decision(id){show('ผลการพิจารณา: '+id,`<form id="decisionForm"><div class="grid">${['ผ่านการคัดเลือก','ไม่ผ่านการคัดเลือก','ผ่านการคัดเลือก (กรณีพิเศษ)','ไม่ผ่านการคัดเลือก (ไม่ผ่านคุณสมบัติ)'].map(s=>`<label><input type="radio" name="status" value="${esc(s)}" required style="width:auto"> ${esc(s)}</label>`).join('')}</div><p><textarea name="reason" placeholder="เหตุผลการพิจารณา"></textarea></p><button>บันทึกผล</button></form>`);$('#decisionForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target);await perform('setApplicationStatus',{applicationId:id,status:fd.get('status'),reason:fd.get('reason')})}}async function group(id){show('เลือกกลุ่มฝึก: '+id,`<form id="groupForm"><select name="trainingGroup" required>${groups.map(g=>`<option value="${g}">${g}</option>`).join('')}</select><p><button>บันทึกกลุ่มฝึก</button></p></form>`);$('#groupForm').onsubmit=async e=>{e.preventDefault();await perform('saveTrainingGroup',{applicationId:id,trainingGroup:new FormData(e.target).get('trainingGroup')})}}async function medical(id){let r=await call('getApplication',{token,applicationId:id});show('ตรวจร่างกาย 20 ข้อ: '+id,`<p>ผ่านอย่างน้อย 14/20 ข้อ (70%) และต้องผ่านข้อ 16–20 ทั้งหมด</p><form id="medicalForm">${checkForm(config.medicalChecks,parse(r.MedicalData),true)}<p><label class="field">ผู้ประเมินและรายละเอียดการตรวจ<textarea name="note" required>${esc(r.MedicalNote)}</textarea></label></p><button>บันทึกผลตรวจร่างกาย</button></form>`);$('#medicalForm').onsubmit=async e=>{e.preventDefault();await perform('saveMedicalReview',{applicationId:id,checks:readChecks(config.medicalChecks),note:new FormData(e.target).get('note')})}}function actionButton(label,fn,id){return `<button class="secondary" data-action="${fn}" data-id="${esc(id)}">${label}</button>`}async function load(){notice('กำลังโหลด...');try{const [data,sum]=await Promise.all([call('getApplications',{token,stage:stage==='rejected'?'':stage,query:$('#query').value,limit:500}),call('getSummary',{token})]);records=data.items||[];if(stage==='rejected')records=records.filter(r=>['ไม่ผ่านการคัดเลือก','ไม่ผ่านการคัดเลือก (ไม่ผ่านคุณสมบัติ)','ไม่ผ่านการตรวจร่างกาย'].includes(r.Status));$('#rows').innerHTML=records.map(r=>`<tr><td>${esc(r.ApplicationID)}</td><td>${esc([r.Prefix,r.FirstName,r.LastName].filter(Boolean).join(' '))}</td><td>${esc(r.Status)}</td><td>${esc(r.TrainingGroup||'-')}</td><td><div class="actions">${actionButton('แก้ไข','edit',r.ApplicationID)}${['รอตรวจสอบ','ไม่ผ่านการตรวจสอบ'].includes(r.Status)?actionButton('ตรวจคุณสมบัติ','review',r.ApplicationID):''}${['อยู่ระหว่างพิจารณา','ไม่ผ่านการตรวจสอบ'].includes(r.Status)?actionButton('พิจารณา','decision',r.ApplicationID):''}${r.Status==='รอเลือกกลุ่มฝึก'?actionButton('กลุ่มฝึก','group',r.ApplicationID):''}${r.Status==='รอตรวจร่างกาย'?actionButton('ตรวจร่างกาย','medical',r.ApplicationID):''}</div></td></tr>`).join('')||'<tr><td colspan="5">ไม่มีรายการ</td></tr>';$('#count').textContent='แสดง '+records.length+' รายการ';$('#summary').innerHTML=`<div class="metric">ผู้สมัครทั้งหมด<strong>${sum.total}</strong></div><div class="metric">ผ่านเข้ารับการฝึก<strong>${sum.byStatus['ผ่านการคัดเลือกเข้ารับการฝึก']||0}</strong></div><div class="metric">ไม่ผ่านตรวจร่างกาย<strong>${sum.byStatus['ไม่ผ่านการตรวจร่างกาย']||0}</strong></div>`;notice('')}catch(e){fail(e)}}$('#rows').onclick=e=>{let b=e.target.closest('button[data-action]');if(b)({edit,review,decision,group,medical})[b.dataset.action](b.dataset.id).catch(fail)};$('#loginform').onsubmit=async e=>{e.preventDefault();notice('กำลังเข้าสู่ระบบ...');try{let r=await call('login',{username:$('#username').value,password:$('#password').value});token=r.token;sessionStorage.setItem('crp_token',token);await start()}catch(e){fail(e)}};async function start(){config=await call('getConfig',{token});$('#loginbox').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#tabs').innerHTML=stages.map(([s,label])=>`<button class="${stage===s?'active':''}" data-stage="${s}">${label}</button>`).join('');await load()}$('#tabs').onclick=e=>{let b=e.target.closest('button[data-stage]');if(!b)return;stage=b.dataset.stage;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));load()};$('#reload').onclick=load;$('#add').onclick=()=>edit().catch(fail);$('#query').onkeydown=e=>{if(e.key==='Enter')load()};$('#logout').onclick=async()=>{try{await call('logout',{token})}catch(e){}sessionStorage.removeItem('crp_token');location.reload()};if(token)start().catch(e=>{sessionStorage.removeItem('crp_token');token='';fail(e)});</script></body></html>
