<!DOCTYPE html><html><head><meta charset="utf-8"><title>CRP Connector</title></head><body><script>
(function(){'use strict';
const allowedOrigin=<?!= JSON.stringify(allowedOrigin) ?>;
if(!/^https:\/\/[^/]+$/.test(allowedOrigin))return;
function send(data){window.parent.postMessage(data,allowedOrigin);}
window.addEventListener('message',function(event){
 if(event.source!==window.parent||event.origin!==allowedOrigin)return;
 const m=event.data;if(!m||m.crp!=='request'||typeof m.id!=='string'||typeof m.action!=='string')return;
 try{google.script.run.withSuccessHandler(function(data){send({crp:'response',id:m.id,ok:true,data:data});}).withFailureHandler(function(error){send({crp:'response',id:m.id,ok:false,message:error&&error.message?error.message:String(error)});}).apiRequest(m.action,m.payload||{});}catch(error){send({crp:'response',id:m.id,ok:false,message:String(error)});}
});
send({crp:'ready'});
})();
</script></body></html>
