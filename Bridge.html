<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><script>
(function(){
const allowed = <?!= JSON.stringify(allowedOrigin) ?>;
window.addEventListener('message', function(event){
 if(event.origin !== allowed || !event.data || event.data.crp !== 'request') return;
 const id = event.data.id;
 const send = function(obj){ event.source.postMessage(Object.assign({crp:'response',id:id},obj),allowed); };
 google.script.run.withSuccessHandler(function(data){send({ok:true,data:data});})
 .withFailureHandler(function(error){send({ok:false,message:error.message || 'Server error'});})
 .apiRequest(event.data.action,event.data.payload || {});
});
window.parent.postMessage({crp:'ready'},allowed);
})();
</script></body></html>
