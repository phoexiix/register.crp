<!DOCTYPE html><html><head><meta charset="utf-8"><title>CRP Connector</title></head><body><script>
(function(){
'use strict';
const allowed = <?!= JSON.stringify(allowedOrigin) ?>;
if (!allowed || !/^https:\/\/[^/]+$/.test(allowed)) return;
function send(data){ window.top.postMessage(data,allowed); }
window.addEventListener('message',function(event){
 if(event.source!==window.top || event.origin!==allowed || !event.data || event.data.crp!=='request') return;
 const id=event.data.id;
 if(typeof id!=='string' || id.length>150) return;
 google.script.run.withSuccessHandler(function(data){send({crp:'response',id:id,ok:true,data:data});})
 .withFailureHandler(function(error){send({crp:'response',id:id,ok:false,message:(error&&error.message)||'Server error'});})
 .apiRequest(event.data.action,event.data.payload||{});
});
send({crp:'ready'});
})();
</script></body></html>
